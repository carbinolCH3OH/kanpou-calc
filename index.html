<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>漢方計算ツール</title>
<style>
  :root{
    --bg: #1c2422;
    --panel: #f2ede2;
    --ink: #23231f;
    --ink-soft: #6b6a60;
    --line: #d8d0bd;
    --accent: #b5622a;
    --accent-soft: #e8dcc8;
    --red: #c0392b;
    --mono: 'SFMono-Regular', Consolas, 'Courier New', monospace;
  }
  *{box-sizing:border-box;}
  html{ -webkit-text-size-adjust: 100%; }
  html, body{
    height: 100%;
    overflow: hidden;
  }
  body{
    margin:0;
    background: var(--bg);
    font-family: "Hiragino Sans", "Yu Gothic", "Segoe UI", sans-serif;
    color: var(--ink);
    display:flex;
    justify-content:center;
    align-items: stretch;
  }
  .sheet{
    width: 100%;
    max-width: 460px;
    background: var(--panel);
    display:flex;
    flex-direction: column;
    height: 100%;
    overflow: hidden;
  }

  /* ---- header ---- */
  .head{
    flex: 0 0 auto;
    padding: 10px 16px;
    border-bottom: 2px solid var(--ink);
    display:flex;
    align-items:center;
    gap: 10px;
  }
  .hamburger-btn{
    flex: 0 0 auto;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: none;
    background: var(--ink);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap: 4px;
    cursor: pointer;
    padding: 0;
  }
  .hamburger-btn span{
    display:block;
    width: 15px; height: 2px;
    background: #fff;
    border-radius: 2px;
  }
  .head-titles{ display:flex; flex-direction:column; gap:1px; min-width:0; }
  .head-titles h1{
    font-size: 14px; margin:0; font-weight:700; line-height:1.2;
  }
  .preset-current{
    font-size: 12px;
    color: var(--accent);
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ---- scrollable middle ---- */
  .body-area{
    flex: 1 1 auto;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }
  .section{
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
  }
  .label-title{
    font-size: 10.5px;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    margin-bottom: 8px;
    font-weight: 700;
  }
  .row{
    display:flex;
    align-items:center;
    gap: 8px;
    margin-bottom: 7px;
  }
  .row:last-child{ margin-bottom:0; }
  .row > label{
    flex: 0 0 52px;
    font-size: 13px;
    font-weight: 700;
  }
  .unitline{
    display:flex;
    align-items:center;
    gap:6px;
    flex:1;
    min-width: 0;
  }
  input[type=number]{
    font-family: var(--mono);
    font-size: 16px;
    padding: 8px;
    border: 1px solid var(--line);
    border-radius: 5px;
    background: #fff;
    width: 100%;
    min-width: 0;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    -moz-appearance: textfield;
  }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{
    -webkit-appearance: none; margin: 0;
  }
  input[type=number]:focus{
    outline:none;
    border-color: var(--accent);
  }
  .small-label{
    font-size: 11.5px;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  /* unit values: plain red text, no box */
  .unit-val{
    font-family: var(--mono);
    font-size: 19px;
    font-weight: 700;
    color: var(--red);
    white-space: nowrap;
    min-width: 44px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .unit-val.plain{
    font-size: 15px;
    font-weight: 400;
    color: var(--ink-soft);
  }

  .subtotal{
    margin-top: 10px;
    padding-top: 9px;
    border-top: 1px dashed var(--line);
    display:flex;
    align-items:center;
    justify-content: space-between;
    font-size: 12.5px;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }
  .subtotal b{ color: var(--ink); font-size: 15px; }
  #resetBtn{
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 8px 18px;
    border-radius: 18px;
    border: none;
    background: rgba(0,0,0,0.06);
    color: var(--ink-soft);
    cursor: pointer;
  }
  #resetBtn:active{ background: rgba(0,0,0,0.14); color: var(--ink); }

  .weight-options{
    display:flex; flex-wrap:wrap; gap: 7px;
  }
  .wchip{
    font-family: var(--mono);
    font-size: 14px;
    padding: 8px 15px;
    border-radius: 20px;
    border: 1px solid var(--line);
    background: #fff;
    cursor: pointer;
    color: var(--ink);
  }
  .wchip.active{
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 700;
  }
  .extra-row{
    margin-top: 11px;
    padding-top: 10px;
    border-top: 1px dashed var(--line);
  }
  .extra-row input[type=number]{ max-width: 100px; }

  /* ---- pinned result ---- */
  .result{
    flex: 0 0 auto;
    background: var(--ink);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  }
  .result .grand{
    display:flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
  }
  .result .grand .lbl{
    font-size: 15px;
    color: var(--accent-soft);
    font-weight: 700;
  }
  .result .grand .val{
    font-family: var(--mono);
    font-size: 34px;
    font-weight: 800;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }
  .result .grand .val .u{
    font-size: 14px;
    color: var(--accent-soft);
    font-weight: 400;
    margin-left: 2px;
  }
  .result .sub{
    display:flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 11.5px;
    color: #9c968a;
    margin-top: 5px;
    font-variant-numeric: tabular-nums;
  }

  /* ---- drawer ---- */
  .drawer-overlay{
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    opacity: 0; pointer-events: none;
    transition: opacity .2s ease;
    z-index: 40;
  }
  .drawer-overlay.open{ opacity: 1; pointer-events: auto; }
  .drawer{
    position: fixed; top:0; left:0; bottom:0;
    width: 80%; max-width: 300px;
    background: var(--panel);
    z-index: 50;
    transform: translateX(-100%);
    transition: transform .25s ease;
    box-shadow: 2px 0 24px rgba(0,0,0,0.35);
    display:flex; flex-direction:column;
  }
  .drawer.open{ transform: translateX(0); }
  .drawer-head{
    display:flex; align-items:center; justify-content:space-between;
    padding: 16px 16px 12px;
    border-bottom: 2px solid var(--ink);
    font-weight:700; font-size:14px;
  }
  .drawer-head button{
    border:none; background:none; font-size:17px;
    color: var(--ink-soft); cursor:pointer; padding: 2px 6px;
  }
  .drawer-list{ overflow-y:auto; flex:1; }
  .drawer-item{
    display:block; width:100%; text-align:left;
    padding: 13px 16px;
    border:none; border-bottom: 1px solid var(--line);
    background:none; font-family: inherit; font-size: 13.5px;
    color: var(--ink); cursor:pointer;
  }
  .drawer-item.active{
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 700;
  }
</style>
</head>
<body>
<div class="sheet">

  <div class="head">
    <button class="hamburger-btn" id="presetTrigger" aria-label="銘柄選択">
      <span></span><span></span><span></span>
    </button>
    <div class="head-titles">
      <h1>漢方計算ツール</h1>
      <span class="preset-current" id="presetTriggerLabel">ツムラ大箱(189包)</span>
    </div>
  </div>

  <div class="body-area">

    <div class="section">
      <div class="label-title">数量入力</div>

      <div class="row" id="boxRow">
        <label>箱</label>
        <div class="unitline">
          <input type="number" inputmode="numeric" enterkeyhint="next" id="boxCount" min="0" value="0">
          <span class="small-label">箱 ×</span>
          <span class="unit-val" id="boxUnit">189</span>
          <span class="small-label" id="boxUnitSuffix">包</span>
        </div>
      </div>

      <div class="row" id="bundleRow">
        <label id="bundleLabel">束</label>
        <div class="unitline">
          <input type="number" inputmode="numeric" enterkeyhint="next" id="bundleCount" min="0" value="0">
          <span class="small-label" id="bundleLabelSuffix">束 ×</span>
          <span class="unit-val plain" id="bundleUnit">21</span>
          <span class="small-label" id="bundleUnitSuffix">包</span>
        </div>
      </div>

      <div class="row" id="sheetRow">
        <label>シート</label>
        <div class="unitline">
          <input type="number" inputmode="numeric" enterkeyhint="next" id="sheetCount" min="0" value="0">
          <span class="small-label">枚 ×</span>
          <span class="unit-val plain" id="sheetUnit">3</span>
          <span class="small-label" id="sheetUnitSuffix">包</span>
        </div>
      </div>

      <div class="row">
        <label>個別</label>
        <div class="unitline">
          <input type="number" inputmode="numeric" enterkeyhint="next" id="looseCount" min="0" value="0">
          <span class="small-label" id="looseUnitSuffix">包</span>
        </div>
      </div>

      <div class="subtotal">
        <button id="resetBtn" type="button">リセット</button>
        <span>合計 <b id="totalPieces">0</b> <span id="totalUnitLabel">包</span></span>
      </div>
    </div>

    <div class="section">
      <div class="label-title" id="factorTitle">グラム換算（1包あたり）</div>
      <div class="weight-options" id="weightOptions"></div>

      <div class="row extra-row">
        <label>追加</label>
        <div class="unitline">
          <span class="small-label">＋</span>
          <input type="number" inputmode="decimal" enterkeyhint="done" id="extraAmount" min="0" step="0.1" value="0">
          <span class="small-label" id="extraUnitLabel">g（バラ分）</span>
        </div>
      </div>
    </div>

  </div>

  <div class="result">
    <div class="grand">
      <span class="lbl" id="resultLabel">総重量</span>
      <span class="val" id="resWeight">0<span class="u" id="resUnit">g</span></span>
    </div>
    <div class="sub">
      <span id="resPieces">0 包</span>
      <span id="resFactor">2.5 g/包</span>
    </div>
  </div>

</div>

<div class="drawer-overlay" id="drawerOverlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <span>銘柄を選択</span>
    <button id="drawerClose">✕</button>
  </div>
  <div class="drawer-list">
    <button class="drawer-item" data-key="189">ツムラ大箱(189包)</button>
    <button class="drawer-item" data-key="84">ツムラ中箱(84包)</button>
    <button class="drawer-item" data-key="42">ツムラ小箱(42包)</button>
    <button class="drawer-item" data-key="kracie42">クラシエ小箱(42包)</button>
    <button class="drawer-item" data-key="kracie168">クラシエ大箱(168包)</button>
    <button class="drawer-item" data-key="kracie28">クラシエ小箱(28包)</button>
    <button class="drawer-item" data-key="kracie_tab252">クラシエ錠(252錠)</button>
    <button class="drawer-item" data-key="kracie_tab168">クラシエ錠(168錠)</button>
    <button class="drawer-item" data-key="kracie_tab378">クラシエ錠(378錠)</button>
    <button class="drawer-item" data-key="taikodo84">太虎堂(84包)</button>
    <button class="drawer-item" data-key="uchida840">ウチダ(840丸)</button>
    <button class="drawer-item" data-key="kotaro42">コタロー(42包)</button>
    <button class="drawer-item" data-key="kotaro168">コタロー(168包)</button>
    <button class="drawer-item" data-key="kotaro231">コタロー(231包)</button>
    <button class="drawer-item" data-key="kotaro1260">コタロー(1260錠)</button>
    <button class="drawer-item" data-key="sanwa84">三和(84包)</button>
    <button class="drawer-item" data-key="sanwa300">三和(300包)</button>
    <button class="drawer-item" data-key="honzo42">本草(42包)</button>
    <button class="drawer-item" data-key="osugi84">オースギ(84包)</button>
    <button class="drawer-item" data-key="toyo252">東洋(252包)</button>
  </div>
</div>

<script>
  const presets = {
    '189':      { box: 189, hasBundle: true,  bundleLabel: '束', bundleUnit: 21, hasSheet: true,  sheetUnit: 3, weights: [{v:2.5,u:'g'},{v:3,u:'g'}] },
    '84':       { box: 84,  hasBundle: true,  bundleLabel: '束', bundleUnit: 21, hasSheet: true,  sheetUnit: 3, weights: [{v:2.5,u:'g'},{v:3,u:'g'}] },
    '42':       { box: 42,  hasBundle: true,  bundleLabel: '束', bundleUnit: 21, hasSheet: true,  sheetUnit: 3, weights: [{v:2.5,u:'g'},{v:3,u:'g'}] },
    'kracie42': { box: 42,  hasBundle: true,  bundleLabel: '袋', bundleUnit: 21, hasSheet: false, sheetUnit: 3, weights: [{v:2,u:'g'},{v:2.5,u:'g'}] },
    'kracie168':{ box: 168, hasBundle: true,  bundleLabel: '袋', bundleUnit: 14, hasSheet: false, sheetUnit: 3, weights: [{v:3,u:'g'},{v:3.75,u:'g'}] },
    'kracie28': { box: 28,  hasBundle: true,  bundleLabel: '袋', bundleUnit: 14, hasSheet: false, sheetUnit: 3, weights: [{v:3,u:'g'},{v:3.75,u:'g'}] },
    'kracie_tab252': { box: 84, hasBundle: false, bundleLabel: '束', bundleUnit: 21, hasSheet: true, sheetUnit: 6, weights: [{v:3,u:'錠'}] },
    'kracie_tab168': { box: 42, hasBundle: false, bundleLabel: '束', bundleUnit: 21, hasSheet: true, sheetUnit: 3, weights: [{v:4,u:'錠'}] },
    'kracie_tab378': { box: 126, hasBundle: true, bundleLabel: '束', bundleUnit: 42, hasSheet: true, sheetUnit: 6, weights: [{v:3,u:'錠'}] },
    'taikodo84': { box: 84, hasBundle: true, bundleLabel: '束', bundleUnit: 21, hasSheet: true, sheetUnit: 3, weights: [{v:2,u:'g'}] },
    'uchida840': { box: 42, hasBundle: false, bundleLabel: '束', bundleUnit: 21, hasSheet: true, sheetUnit: 3, weights: [{v:20,u:'丸'}] },
    'kotaro42': { box: 42, hasBundle: true, bundleLabel: '束', bundleUnit: 21, hasSheet: true, sheetUnit: 3, weights: [{v:2,u:'g'},{v:3,u:'g'}] },
    'kotaro168': { box: 168, hasBundle: true, bundleLabel: '束', bundleUnit: 21, hasSheet: true, sheetUnit: 3, weights: [{v:3,u:'g'}] },
    'kotaro231': { box: 231, hasBundle: true, bundleLabel: '束', bundleUnit: 21, hasSheet: true, sheetUnit: 3, weights: [{v:2,u:'g'}] },
    'kotaro1260': { box: 1260, hasBundle: true, bundleLabel: '瓶', bundleUnit: 126, hasSheet: false, sheetUnit: 3, baseUnit: '錠', weights: [{v:1,u:'錠'}] },
    'sanwa84': { box: 84, hasBundle: true, bundleLabel: '束', bundleUnit: 42, hasSheet: true, sheetUnit: 3, weights: [{v:2.5,u:'g'}] },
    'sanwa300': { box: 300, hasBundle: true, bundleLabel: '束', bundleUnit: 60, hasSheet: true, sheetUnit: 3, weights: [{v:1.5,u:'g'}] },
    'honzo42': { box: 42, hasBundle: true, bundleLabel: '束', bundleUnit: 21, hasSheet: true, sheetUnit: 3, weights: [{v:2.5,u:'g'}] },
    'osugi84': { box: 84, hasBundle: true, bundleLabel: '束', bundleUnit: 21, hasSheet: true, sheetUnit: 3, weights: [
      {v:1,u:'g'},{v:1.5,u:'g'},{v:2,u:'g'},{v:2.5,u:'g'},{v:3,u:'g'},{v:4,u:'g'},
      {v:3,u:'錠'},{v:5,u:'錠'},{v:6,u:'錠'}
    ] },
    'toyo252': { box: 252, hasBundle: true, bundleLabel: '束', bundleUnit: 21, hasSheet: true, sheetUnit: 3, weights: [{v:2,u:'g'}] },
  };

  const RESULT_LABELS = { g: '総重量', '錠': '総錠数', '丸': '総丸数' };

  let weights = [];
  let selectedWeight = null;
  let hasSheet = true;
  let hasBundle = true;
  let hasBox = true;
  let baseUnitLabel = '包';

  const boxRow = document.getElementById('boxRow');
  const boxCount = document.getElementById('boxCount');
  const boxUnit = document.getElementById('boxUnit');
  const boxUnitSuffix = document.getElementById('boxUnitSuffix');
  const resetBtn = document.getElementById('resetBtn');
  const bundleRow = document.getElementById('bundleRow');
  const bundleCount = document.getElementById('bundleCount');
  const bundleUnit = document.getElementById('bundleUnit');
  const bundleLabel = document.getElementById('bundleLabel');
  const bundleLabelSuffix = document.getElementById('bundleLabelSuffix');
  const bundleUnitSuffix = document.getElementById('bundleUnitSuffix');
  const sheetRow = document.getElementById('sheetRow');
  const sheetCount = document.getElementById('sheetCount');
  const sheetUnit = document.getElementById('sheetUnit');
  const sheetUnitSuffix = document.getElementById('sheetUnitSuffix');
  const looseCount = document.getElementById('looseCount');
  const looseUnitSuffix = document.getElementById('looseUnitSuffix');
  const totalUnitLabel = document.getElementById('totalUnitLabel');
  const extraAmount = document.getElementById('extraAmount');
  const extraUnitLabel = document.getElementById('extraUnitLabel');
  const totalPiecesEl = document.getElementById('totalPieces');
  const resPieces = document.getElementById('resPieces');
  const resFactor = document.getElementById('resFactor');
  const resWeight = document.getElementById('resWeight');
  const resUnit = document.getElementById('resUnit');
  const resultLabelEl = document.getElementById('resultLabel');
  const factorTitle = document.getElementById('factorTitle');
  const weightOptionsEl = document.getElementById('weightOptions');
  const presetTrigger = document.getElementById('presetTrigger');
  const presetTriggerLabel = document.getElementById('presetTriggerLabel');
  const drawer = document.getElementById('drawer');
  const drawerOverlay = document.getElementById('drawerOverlay');
  const drawerClose = document.getElementById('drawerClose');
  const drawerItems = Array.from(document.querySelectorAll('.drawer-item'));

  function num(el, fallback){
    const v = parseFloat(el.value);
    return isNaN(v) ? fallback : v;
  }
  function unitNum(el){
    const v = parseFloat(el.textContent);
    return isNaN(v) ? 1 : v;
  }
  function formatNum(n){
    return Math.round(n * 1000) / 1000;
  }

  function getTotalPieces(){
    const bx = hasBox ? (num(boxCount,0) * unitNum(boxUnit)) : 0;
    const bd = hasBundle ? (num(bundleCount,0) * unitNum(bundleUnit)) : 0;
    const sh = hasSheet ? (num(sheetCount,0) * unitNum(sheetUnit)) : 0;
    return bx + bd + sh + num(looseCount,0);
  }

  function renderWeights(){
    weightOptionsEl.innerHTML = '';
    weights.forEach((w) => {
      const chip = document.createElement('div');
      const isActive = selectedWeight && w.v === selectedWeight.v && w.u === selectedWeight.u;
      chip.className = 'wchip' + (isActive ? ' active' : '');
      chip.textContent = w.v + w.u;
      chip.addEventListener('click', () => {
        selectedWeight = w;
        renderWeights();
        update();
      });
      weightOptionsEl.appendChild(chip);
    });
  }

  function update(){
    const total = getTotalPieces();
    const extra = num(extraAmount, 0);

    totalPiecesEl.textContent = formatNum(total);
    resPieces.textContent = formatNum(total) + ' ' + baseUnitLabel;

    if(!selectedWeight){
      // No factor chosen (after reset): show placeholder until one is tapped.
      const hintUnit = weights[0] ? weights[0].u : '';
      resFactor.textContent = '未選択';
      resWeight.childNodes[0].nodeValue = '—';
      resUnit.textContent = '';
      resultLabelEl.textContent = RESULT_LABELS[hintUnit] || '合計';
      extraUnitLabel.textContent = (hintUnit || '') + '（バラ分）';
      return;
    }

    const grand = total * selectedWeight.v + extra;
    resFactor.textContent = selectedWeight.v + ' ' + selectedWeight.u + '/' + baseUnitLabel
      + (extra > 0 ? '  +' + formatNum(extra) + selectedWeight.u : '');
    resWeight.childNodes[0].nodeValue = formatNum(grand);
    resUnit.textContent = selectedWeight.u;
    resultLabelEl.textContent = RESULT_LABELS[selectedWeight.u] || '合計';
    extraUnitLabel.textContent = selectedWeight.u + '（バラ分）';
  }

  function openDrawer(){
    drawer.classList.add('open');
    drawerOverlay.classList.add('open');
  }
  function closeDrawer(){
    drawer.classList.remove('open');
    drawerOverlay.classList.remove('open');
  }

  function applyPreset(key){
    const p = presets[key];
    if(!p) return;

    baseUnitLabel = p.baseUnit || '包';
    boxUnitSuffix.textContent = baseUnitLabel;
    bundleUnitSuffix.textContent = baseUnitLabel;
    sheetUnitSuffix.textContent = baseUnitLabel;
    looseUnitSuffix.textContent = baseUnitLabel;
    totalUnitLabel.textContent = baseUnitLabel;

    hasBox = p.hasBox !== false;
    boxRow.style.display = hasBox ? '' : 'none';
    if(hasBox){
      boxUnit.textContent = p.box;
    } else {
      boxCount.value = 0;
    }

    hasBundle = p.hasBundle;
    bundleRow.style.display = hasBundle ? '' : 'none';
    if(hasBundle){
      bundleUnit.textContent = p.bundleUnit;
      bundleLabel.textContent = p.bundleLabel;
      bundleLabelSuffix.textContent = p.bundleLabel + ' ×';
    } else {
      bundleCount.value = 0;
    }

    hasSheet = p.hasSheet;
    sheetRow.style.display = hasSheet ? '' : 'none';
    if(hasSheet){
      sheetUnit.textContent = p.sheetUnit;
    } else {
      sheetCount.value = 0;
    }

    weights = [...p.weights].sort((a,b) => a.u === b.u ? a.v - b.v : 0);
    selectedWeight = weights[0];

    const units = [...new Set(weights.map(w => w.u))];
    factorTitle.textContent = (units.length === 1
      ? (units[0] === 'g' ? 'グラム換算' : units[0] + '換算')
      : '換算') + '（1' + baseUnitLabel + 'あたり）';

    renderWeights();
    update();

    drawerItems.forEach(btn => {
      btn.classList.toggle('active', btn.dataset.key === key);
      if(btn.dataset.key === key){
        presetTriggerLabel.textContent = btn.textContent;
      }
    });
  }

  const editableInputs = [boxCount, bundleCount, sheetCount, looseCount, extraAmount];

  editableInputs.forEach(el => {
    // Focusing selects all, so typing a digit replaces "0" instead of making "10".
    el.addEventListener('focus', () => {
      setTimeout(() => el.select(), 0);
    });
    el.addEventListener('input', update);

    // Enter advances to the next visible field, wrapping around at the end.
    el.addEventListener('keydown', (e) => {
      if(e.key !== 'Enter') return;
      e.preventDefault();
      const visible = editableInputs.filter(x => x.offsetParent !== null);
      const next = visible[(visible.indexOf(el) + 1) % visible.length];
      if(next){ next.focus(); next.select(); }
    });
  });

  presetTrigger.addEventListener('click', openDrawer);
  drawerClose.addEventListener('click', closeDrawer);
  drawerOverlay.addEventListener('click', closeDrawer);

  drawerItems.forEach(btn => {
    btn.addEventListener('click', () => {
      applyPreset(btn.dataset.key);
      closeDrawer();
    });
  });

  resetBtn.addEventListener('click', () => {
    boxCount.value = 0;
    bundleCount.value = 0;
    sheetCount.value = 0;
    looseCount.value = 0;
    extraAmount.value = 0;
    selectedWeight = null;
    renderWeights();
    update();
  });

  applyPreset(drawerItems[0].dataset.key);
</script>

</body>
</html>
